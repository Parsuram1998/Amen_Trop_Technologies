version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: jobportal-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: projecttrop
      MYSQL_USER: jobuser
      MYSQL_PASSWORD: jobpass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: jobportal-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/projecttrop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: jobuser
      SPRING_DATASOURCE_PASSWORD: jobpass123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIL_USERNAME: fightthefireapp123@gmail.com
      SPRING_MAIL_PASSWORD: kipe zrpt tzvd wtui
      UPLOAD_DIR: /app/uploads
    ports:
      - "8084:8084"
    volumes:
      - app_uploads:/app/uploads
      - app_certs:/app/certificates

volumes:
  mysql_data:
  app_uploads:
  app_certs:
