spring.application.name=JobPortal
server.port=8084
server.servlet.context-path=/
server.servlet.session.timeout=30m
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/projecttrop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobpass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:fightthefireapp123@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:kipe zrpt tzvd wtui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
file.upload-dir=${UPLOAD_DIR:/app/uploads}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

